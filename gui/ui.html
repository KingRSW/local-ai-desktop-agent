<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌面员工</title>
<style>
  :root{
    --bg:#eef1f7;
    --glass:rgba(255,255,255,.62);
    --glass-2:rgba(255,255,255,.45);
    --stroke:rgba(255,255,255,.85);
    --stroke-2:rgba(0,0,0,.06);
    --text:#0d1220;
    --text-2:#5d6780;
    --text-3:#98a1b5;
    --accent:#0a84ff;
    --accent-2:#5e5ce6;
    --ok:#1fbf6b;
    --warn:#ff9f0a;
    --err:#ff453a;
    --code-bg:rgba(255,255,255,.5);
    --shadow:0 24px 60px -20px rgba(20,30,60,.35);
    --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0b10;
      --glass:rgba(255,255,255,.065);
      --glass-2:rgba(255,255,255,.04);
      --stroke:rgba(255,255,255,.12);
      --stroke-2:rgba(255,255,255,.07);
      --text:#f2f4f9;
      --text-2:#a3adc2;
      --text-3:#6c778e;
      --accent:#0a84ff;
      --accent-2:#7d7aff;
      --code-bg:rgba(0,0,0,.32);
      --shadow:0 30px 70px -24px rgba(0,0,0,.75);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;border-radius:12px}
  body{
    font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  /* 背景光斑 —— 液态玻璃的底色来源 */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 22s ease-in-out infinite}
  .b1{width:520px;height:520px;left:-140px;top:-160px;background:radial-gradient(circle,#5e5ce6,transparent 68%)}
  .b2{width:460px;height:460px;right:-120px;top:-80px;background:radial-gradient(circle,#0a84ff,transparent 68%);animation-delay:-7s}
  .b3{width:480px;height:480px;right:14%;bottom:-220px;background:radial-gradient(circle,#ff375f,transparent 70%);animation-delay:-13s;opacity:.38}
  .b4{width:400px;height:400px;left:18%;bottom:-200px;background:radial-gradient(circle,#30d158,transparent 70%);animation-delay:-4s;opacity:.3}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,30px) scale(1.08)}66%{transform:translate(-30px,20px) scale(.95)}}
  @media (prefers-color-scheme: light){.blob{opacity:.38}}

  .glass{
    background:var(--glass);
    backdrop-filter:blur(34px) saturate(180%);
    -webkit-backdrop-filter:blur(34px) saturate(180%);
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:var(--shadow), inset 0 1px 0 var(--stroke);
  }

  .app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 290px;grid-template-rows:auto 1fr;gap:12px;padding:0 12px 12px}
  /* 自绘标题栏（frameless 窗口） */
  .titlebar{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:0 4px;height:46px;flex:none}
  .lights{display:flex;gap:8px;padding:6px 8px 6px 8px;margin-right:2px}
  .lt{width:12px;height:12px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
      font:700 7.5px/1 -apple-system,sans-serif;color:rgba(0,0,0,0);transition:color .15s,filter .15s}
  .lt.close{background:#ff5f57}.lt.min{background:#febc2e}.lt.max{background:#28c840}
  .lt.close::before{content:"✕"}.lt.min::before{content:"−"}.lt.max::before{content:"＋"}
  .lights:hover .lt{color:rgba(0,0,0,.55)}
  .lt:hover{filter:brightness(1.06)}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--accent-2),var(--accent));display:grid;place-items:center;box-shadow:0 4px 12px -2px rgba(10,132,255,.5)}
  .logo svg{width:15px;height:15px;fill:#fff}
  .brand{font-size:13.5px;font-weight:600;letter-spacing:.2px}
  .brand small{font-weight:400;color:var(--text-3);margin-left:6px;font-size:11px}
  .spacer{flex:1}
  .pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:500;
        background:var(--glass-2);border:1px solid var(--stroke-2);color:var(--text-2);transition:.25s}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);transition:.25s}
  .pill.run{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .pill.run .dot{background:var(--accent);animation:breathe 1.1s ease-in-out infinite}
  .pill.done .dot{background:var(--ok)}
  .pill.err .dot{background:var(--err)}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}

  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .card{padding:14px 16px;display:flex;flex-direction:column;min-height:0}
  .card h2{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}

  /* 指令输入 */
  textarea{
    width:100%;background:transparent;border:0;outline:0;resize:none;color:var(--text);
    font:inherit;font-size:14.5px;line-height:1.6;min-height:52px;max-height:150px;-webkit-user-select:text;user-select:text;
  }
  textarea::placeholder{color:var(--text-3)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .chip{padding:5px 10px;border-radius:999px;font-size:11.5px;color:var(--text-2);cursor:pointer;
        background:var(--glass-2);border:1px solid var(--stroke-2);transition:.18s;white-space:nowrap}
  .chip:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);transform:translateY(-1px)}
  .row{display:flex;align-items:center;gap:9px}
  button{font:inherit;font-weight:560;font-size:13px;border:0;border-radius:12px;cursor:pointer;transition:.18s;padding:9px 18px;-webkit-app-region:no-drag}
  .primary{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
  .primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .primary:active{transform:scale(.98)}
  .ghost{background:var(--glass-2);color:var(--text-2);border:1px solid var(--stroke-2)}
  .ghost:hover{color:var(--text);background:color-mix(in srgb,var(--text) 8%,transparent)}
  .stop{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 35%,transparent)}
  button[disabled]{opacity:.42;cursor:not-allowed;transform:none!important;filter:none!important}
  .hint{font-size:11px;color:var(--text-3)}
  kbd{font:inherit;font-size:10.5px;padding:1.5px 5px;border-radius:5px;background:var(--glass-2);border:1px solid var(--stroke-2);color:var(--text-3)}

  /* 日志 */
  .logcard{flex:1;min-height:0}
  .loghead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .loghead h2{margin:0}
  .loghead .spacer{flex:1}
  .mini{padding:3px 9px;font-size:11px;border-radius:8px}
  .logbox{
    flex:1;overflow-y:auto;background:var(--code-bg);border:1px solid var(--stroke-2);border-radius:14px;
    padding:11px 13px;font:12px/1.75 "SF Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-user-select:text;user-select:text;white-space:pre-wrap;word-break:break-word;color:var(--text-2);
  }
  .logbox::-webkit-scrollbar{width:8px}
  .logbox::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 18%,transparent);border-radius:99px}
  .ln{display:block;animation:fin .28s ease}
  @keyframes fin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .ln.step{color:var(--text)}
  .ln.ok{color:var(--ok)}
  .ln.warn{color:var(--warn)}
  .ln.err{color:var(--err)}
  .ln.info{color:var(--text-3)}
  .ln.acc{color:var(--accent)}
  .empty{color:var(--text-3);font-size:12px}

  /* 侧栏 */
  .side{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
  .side::-webkit-scrollbar{width:6px}
  .side::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 15%,transparent);border-radius:99px}
  .item{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;color:var(--text-2)}
  .item .ic{width:16px;text-align:center;font-size:12px}
  .item .val{margin-left:auto;font-size:11.5px;color:var(--text-3);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
  .st.ok{background:var(--ok);box-shadow:0 0 8px -1px var(--ok)}
  .st.bad{background:var(--err);box-shadow:0 0 8px -1px var(--err)}
  .st.wait{background:var(--warn);animation:breathe 1.4s infinite}
  select{
    width:100%;font:inherit;font-size:12.5px;color:var(--text);background:var(--glass-2);
    border:1px solid var(--stroke-2);border-radius:10px;padding:7px 9px;outline:0;cursor:pointer;
  }
  .switch{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
  .switch span{font-size:12.5px;color:var(--text-2)}
  .sw{width:38px;height:22px;border-radius:99px;background:color-mix(in srgb,var(--text) 16%,transparent);position:relative;transition:.22s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.22s}
  .switch.on .sw{background:var(--accent)}
  .switch.on .sw::after{transform:translateX(16px)}
  .link{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;color:var(--accent);cursor:pointer}
  .link:hover{opacity:.75}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:9;
    padding:9px 18px;border-radius:999px;font-size:12.5px;color:var(--text);
    background:var(--glass);backdrop-filter:blur(30px);border:1px solid var(--stroke);box-shadow:var(--shadow);
    opacity:0;transition:.3s;pointer-events:none
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<div class="app">
  <div class="titlebar">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 3 6.5v6c0 5 3.8 8.9 9 9.5 5.2-.6 9-4.5 9-9.5v-6L12 2Zm0 4.2 5 2.5v3.8c0 3-1.9 5.4-5 6.2-3.1-.8-5-3.2-5-6.2V8.7l5-2.5Z"/></svg></div>
    <div class="brand">本地 AI · 全离线<small>指令 → 直接操作你的电脑</small></div>
    <div class="spacer"></div>
    <div class="pill" id="pill"><i class="dot"></i><span id="pillText">就绪</span></div>
  </div>

  <div class="col">
    <div class="card glass">
      <textarea id="cmd" placeholder="用中文告诉电脑要做什么，例如：打开微信 给文件传输助手 发条消息：在吗" rows="2"></textarea>
      <div class="chips" id="chips"></div>
      <div class="row">
        <button class="primary" id="run">执行</button>
        <button class="ghost" id="preview">仅预览</button>
        <button class="stop" id="stop" style="display:none">停止</button>
        <div class="spacer"></div>
        <span class="hint"><kbd>⌘</kbd>+<kbd>↵</kbd> 执行</span>
      </div>
    </div>

    <div class="card glass logcard">
      <div class="loghead">
        <h2>运行日志</h2>
        <div class="spacer"></div>
        <button class="ghost mini" id="clear">清空</button>
        <button class="ghost mini" id="copy">复制</button>
      </div>
      <div class="logbox" id="log"><span class="empty">等待指令…  输入一句话，我直接在屏幕上操作。</span></div>
    </div>
  </div>

  <div class="side">
    <div class="card glass">
      <h2>环境自检</h2>
      <div class="item"><i class="st" id="stOllama"></i><span>本地模型服务</span><span class="val" id="vOllama">检测中</span></div>
      <div class="item"><i class="st" id="stOcr"></i><span>系统 OCR 引擎</span><span class="val" id="vOcr">检测中</span></div>
      <div class="item"><i class="st" id="stAx"></i><span>辅助功能权限</span><span class="val" id="vAx">检测中</span></div>
      <div class="item"><i class="st" id="stSc"></i><span>屏幕录制权限</span><span class="val" id="vSc">检测中</span></div>
      <div style="height:6px"></div>
      <div class="link" data-open="accessibility"><span>打开辅助功能设置</span><span>›</span></div>
      <div class="link" data-open="screencapture"><span>打开屏幕录制设置</span><span>›</span></div>
      <div class="link" id="recheck"><span>重新检测</span><span>↻</span></div>
    </div>

    <div class="card glass">
      <h2>运行选项</h2>
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:5px">视觉模型（定位兜底用）</div>
      <select id="model"><option>自动选择</option></select>
      <div style="height:10px"></div>
      <div class="switch on" id="swShot"><i class="sw"></i><span>执行后回显屏幕截图</span></div>
      <div class="switch" id="swVerbose"><i class="sw"></i><span>显示屏幕识别文字</span></div>
      <div style="height:6px"></div>
      <div class="row"><span style="font-size:11.5px;color:var(--text-3)">步进间隔</span>
        <input id="delay" type="range" min="0.4" max="4" step="0.2" value="1.6" style="flex:1">
        <span style="font-size:11.5px;color:var(--text-2);width:30px;text-align:right" id="delayV">1.6s</span>
      </div>
    </div>

    <div class="card glass">
      <h2>能力</h2>
      <div class="item"><span class="ic">🧩</span><span>多步任务拆解</span></div>
      <div class="item"><span class="ic">⌨️</span><span>快捷键 / 组合键</span></div>
      <div class="item"><span class="ic">💬</span><span>微信发消息</span></div>
      <div class="item"><span class="ic">🔍</span><span>OCR 认字定位</span></div>
      <div class="item"><span class="ic">🌐</span><span>未装 App 走网页版</span></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let running = false, pollTimer = null, pendingShot = null;

const CHIPS = [
  "打开微信 给文件传输助手 发条消息：在吗",
  "打开计算器 然后点 1 点 2",
  "打开哔哩哔哩 搜索 数码测评",
  "打开Safari 按 command+t 输入 知乎 按回车",
  "打开系统设置 搜索 蓝牙",
  "打开备忘录 输入 今天要买牛奶"
];

function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), 1700);
}

function lineClass(s){
  if(/✅|完成|成功|已/.test(s)) return "ok";
  if(/⚠️|找不到|失败|没找到|不可用/.test(s)) return "warn";
  if(/⛔|❌|错误|异常/.test(s)) return "err";
  if(/▶|🔄/.test(s)) return "step";
  if(/👀|🧩|🤖|🔍/.test(s)) return "acc";
  return "info";
}

let lines = [];
function pushLog(arr){
  const box = $("log");
  if(box.querySelector(".empty")) box.innerHTML = "";
  for(const s of arr){
    lines.push(s);
    const d = document.createElement("span");
    d.className = "ln " + lineClass(s);
    d.textContent = s;
    box.appendChild(d);
  }
  if(arr.length) box.scrollTop = box.scrollHeight;
}

function setStatus(mode, text){
  const p = $("pill"); p.className = "pill" + (mode ? " " + mode : "");
  $("pillText").textContent = text;
}

async function poll(){
  try{
    const r = await window.pywebview.api.poll();
    if(r.lines && r.lines.length) pushLog(r.lines);
    if(r.shot){ renderShot(r.shot); pendingShot = null; }
    if(r.running !== running){
      running = r.running;
      $("run").disabled = running; $("preview").disabled = running;
      $("stop").style.display = running ? "" : "none";
      if(!running) setStatus(r.ok === false ? "err" : "done", r.ok === false ? "执行出错" : "已完成");
    }
    if(r.state) setStatus(running ? "run" : (r.ok === false ? "err" : "done"), r.state);
  }catch(e){}
}

function renderShot(dataUrl){
  const box = $("log");
  if(box.querySelector(".empty")) box.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ln acc";
  wrap.innerHTML = '<div style="margin:6px 0 4px;color:var(--text-3)">📸 执行后屏幕</div>';
  const img = document.createElement("img");
  img.src = dataUrl;
  img.style.cssText = "width:100%;border-radius:12px;border:1px solid var(--stroke-2);margin:4px 0 10px";
  wrap.appendChild(img); box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

async function doRun(preview){
  const cmd = $("cmd").value.trim();
  if(!cmd){ toast("先输入一句指令"); return; }
  if(running) return;
  $("log").innerHTML = "";
  lines = [];
  setStatus("run","执行中");
  running = true;
  $("run").disabled = true; $("preview").disabled = true; $("stop").style.display = "";
  const r = await window.pywebview.api.run(cmd, preview, $("model").value, parseFloat($("delay").value));
  if(!r.ok){ toast(r.msg || "启动失败"); running = false;
    $("run").disabled = false; $("preview").disabled = false; $("stop").style.display="none"; setStatus("err","无法启动"); }
}

async function refreshEnv(){
  const r = await window.pywebview.api.env_check();
  const set = (id, ok, val) => {
    const el = $(id); el.className = "st " + (ok === true ? "ok" : ok === false ? "bad" : "wait");
    const v = $("v" + id.slice(2));
    if(v) v.textContent = val;
  };
  set("stOllama", r.ollama, r.ollama ? "在线" : "未启动");
  set("stOcr", r.ocr, r.ocr ? "就绪" : "缺失");
  set("stAx", r.ax, r.ax ? "已授权" : "未授权");
  set("stSc", r.sc, r.sc ? "已授权" : "未授权");
  const sel = $("model"); sel.innerHTML = "";
  const auto = document.createElement("option"); auto.textContent = "自动选择"; auto.value=""; sel.appendChild(auto);
  (r.models||[]).forEach(m => { const o = document.createElement("option"); o.textContent = m; o.value = m; sel.appendChild(o); });
  if(r.model){ sel.value = r.model; }
  return r;
}

function initEvents(){
  CHIPS.forEach(c => {
    const b = document.createElement("div");
    b.className = "chip"; b.textContent = c;
    b.onclick = () => { $("cmd").value = c; $("cmd").focus(); };
    $("chips").appendChild(b);
  });
  $("run").onclick = () => doRun(false);
  $("preview").onclick = () => doRun(true);
  $("stop").onclick = async () => { await window.pywebview.api.stop(); toast("已请求停止"); };
  $("clear").onclick = () => { $("log").innerHTML = '<span class="empty">等待指令…</span>'; lines = []; };
  $("copy").onclick = () => {
    const t = lines.join("\n");
    navigator.clipboard.writeText(t).then(()=>toast("日志已复制"), ()=>toast("复制失败"));
  };
  $("recheck").onclick = async () => { toast("重新检测中…"); await refreshEnv(); toast("检测完成"); };
  document.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => window.pywebview.api.open_settings(el.dataset.open);
  });
  document.querySelectorAll(".lt").forEach(el => {
    el.onclick = () => window.pywebview.api.win(el.dataset.win);
  });
  $("swShot").onclick = async () => {
    const on = !$("swShot").classList.contains("on");
    $("swShot").classList.toggle("on");
    await window.pywebview.api.set_autoshot(on);
  };
  $("swVerbose").onclick = async () => {
    const on = !$("swVerbose").classList.contains("on");
    $("swVerbose").classList.toggle("on");
    await window.pywebview.api.set_verbose(on);
  };
  $("delay").oninput = () => $("delayV").textContent = parseFloat($("delay").value).toFixed(1) + "s";
  $("cmd").oninput = e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px"; };
  document.addEventListener("keydown", e => {
    if((e.metaKey || e.ctrlKey) && e.key === "Enter"){ e.preventDefault(); doRun(false); }
  });
}

window.addEventListener("pywebviewready", async () => {
  initEvents();
  await refreshEnv();
  pollTimer = setInterval(poll, 220);
});
</script>
